name: Release Carpet FGA Addition
run-name: Publish ${{ github.event.release.tag_name || inputs.tag }}

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published GitHub Release tag'
        required: true
        type: string
      destinations:
        description: 'External platform repair target'
        required: false
        type: choice
        default: all
        options:
          - all
          - modrinth
          - curseforge
      versions:
        description: 'Build projects to repair, comma-separated, or all'
        required: false
        type: string
        default: all
      legacy_label_cleanup:
        description: 'Legacy CF:<id> Asset label cleanup (run one canary before confirmed batch)'
        required: false
        type: choice
        default: none
        options:
          - none
          - canary
          - confirmed

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect existing GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      commit: ${{ steps.context.outputs.commit }}
      prerelease: ${{ steps.context.outputs.prerelease }}
      matrix: ${{ steps.context.outputs.matrix }}
      versions: ${{ steps.context.outputs.versions }}
      all_versions: ${{ steps.context.outputs.all_versions }}
      is_all_versions: ${{ steps.context.outputs.is_all_versions }}
      publisher_commit: ${{ steps.context.outputs.publisher_commit }}
    steps:
      - name: Select existing Release tag
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DESTINATIONS: ${{ inputs.destinations }}
          LEGACY_LABEL_CLEANUP: ${{ inputs.legacy_label_cleanup }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          tag="$EVENT_TAG"
          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            tag="$INPUT_TAG"
            if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
              echo "Manual repair runs must be dispatched from the default branch $DEFAULT_BRANCH" >&2
              exit 1
            fi
            if [[ "$LEGACY_LABEL_CLEANUP" != 'none' && "$DESTINATIONS" == 'modrinth' ]]; then
              echo 'Legacy Asset label cleanup requires a CurseForge repair destination' >&2
              exit 1
            fi
          fi
          if [[ -z "$tag" ]]; then
            echo 'Release tag is empty' >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Check out publisher helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || format('refs/tags/{0}', steps.release.outputs.tag) }}
          fetch-depth: 1
          path: publisher

      - name: Check out Release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ steps.release.outputs.tag }}
          fetch-depth: 1
          path: release-source

      - name: Read GitHub Release metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,body,isDraft,isPrerelease,targetCommitish \
            > release.json

      - name: Validate Release and publication metadata
        id: context
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          TARGET_VERSIONS: ${{ github.event_name == 'workflow_dispatch' && inputs.versions || 'all' }}
        run: |
          set -euo pipefail
          commit="$(git -C release-source rev-parse HEAD)"
          publisher_commit="$(git -C publisher rev-parse HEAD)"
          python publisher/scripts/python/release_metadata.py inspect-release \
            --repo-root release-source \
            --release-json release.json \
            --tag "$RELEASE_TAG" \
            --commit "$commit" \
            --target "$TARGET_VERSIONS" \
            --output release-context.json \
            --github-output "$GITHUB_OUTPUT"
          printf 'publisher_commit=%s\n' "$publisher_commit" >> "$GITHUB_OUTPUT"

          if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' ]]; then
            prerelease="$(python -c "import json; print(str(json.load(open('release-context.json'))['prerelease']).lower())")"
            if [[ "$prerelease" == 'true' ]]; then
              echo 'External platform repair is disabled for prereleases' >&2
              exit 1
            fi
          fi

      - name: Upload immutable Release context
        uses: actions/upload-artifact@v4
        with:
          name: release-context
          path: release-context.json
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  build:
    name: Build Release tag
    needs: inspect
    if: ${{ github.event_name == 'release' }}
    uses: ./.github/workflows/build.yml
    with:
      target_subproject: all
      ref: ${{ needs.inspect.outputs.commit }}
      release_version: ${{ needs.inspect.outputs.tag }}

  package-release:
    name: Package built Release JARs
    needs: [inspect, build]
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out publisher helper
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.publisher_commit }}
          fetch-depth: 1
          path: publisher

      - name: Download Release context
        uses: actions/download-artifact@v4
        with:
          name: release-context
          path: release-context

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: build-artifacts

      - name: Validate and name final JARs
        shell: bash
        run: |
          set -euo pipefail
          python publisher/scripts/python/release_metadata.py assemble-build \
            --context release-context/release-context.json \
            --artifacts-root build-artifacts \
            --build-versions '${{ needs.build.outputs.versions }}' \
            --build-commit '${{ needs.build.outputs.commit }}' \
            --output-dir release-package

      - name: Upload validated Release package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release-package
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  package-dispatch:
    name: Collect existing GitHub Release Assets
    needs: inspect
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out current publisher helper
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.publisher_commit }}
          fetch-depth: 1
          path: publisher

      - name: Download Release context
        uses: actions/download-artifact@v4
        with:
          name: release-context
          path: release-context

      - name: Download existing GitHub Release JARs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.inspect.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p existing-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "carpet-fga-addition-$RELEASE_TAG-mc*.jar" \
            --dir existing-assets

      - name: Validate existing Release Assets
        shell: bash
        run: |
          set -euo pipefail
          python publisher/scripts/python/release_metadata.py assemble-assets \
            --context release-context/release-context.json \
            --assets-root existing-assets \
            --output-dir release-package

      - name: Upload validated repair package
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: release-package
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  publish-github:
    name: Publish GitHub Release Assets
    needs: [inspect, package-release]
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out publisher helper
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.publisher_commit }}
          fetch-depth: 1
          path: publisher

      - name: Download validated Release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-package

      - name: Upload or verify GitHub Release Assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.inspect.outputs.tag }}
        run: |
          set -euo pipefail
          python publisher/scripts/python/github_release_assets.py \
            --manifest release-package/release-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$RELEASE_TAG"

  publish-modrinth:
    name: Publish Modrinth Minecraft ${{ matrix.mc_version }}
    needs: [inspect, package-release, package-dispatch, publish-github]
    if: >-
      ${{
        always() &&
        needs.inspect.result == 'success' &&
        needs.inspect.outputs.prerelease != 'true' &&
        (
          (
            github.event_name == 'release' &&
            needs.package-release.result == 'success' &&
            needs.publish-github.result == 'success'
          ) ||
          (
            github.event_name == 'workflow_dispatch' &&
            needs.package-dispatch.result == 'success' &&
            (inputs.destinations == 'all' || inputs.destinations == 'modrinth')
          )
        )
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.inspect.outputs.matrix) }}
    steps:
      - name: Check out publisher helper
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.publisher_commit }}
          fetch-depth: 1
          path: publisher

      - name: Download validated Release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-package

      - name: Create or reconcile tag-only Modrinth Version
        shell: bash
        env:
          MODRINTH_API_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT_ID || 'Nfhbipsz' }}
        run: |
          set -euo pipefail
          python publisher/scripts/python/modrinth_publish.py \
            --manifest release-package/release-manifest.json \
            --project "$MODRINTH_PROJECT" \
            --build-project '${{ matrix.mc_version }}'

  curseforge-state-audit:
    name: Audit all selected CurseForge publication state
    needs: [inspect, package-release, package-dispatch, publish-github]
    if: >-
      ${{
        always() &&
        needs.inspect.result == 'success' &&
        needs.inspect.outputs.prerelease != 'true' &&
        (
          (
            github.event_name == 'release' &&
            needs.package-release.result == 'success' &&
            needs.publish-github.result == 'success'
          ) ||
          (
            github.event_name == 'workflow_dispatch' &&
            needs.package-dispatch.result == 'success' &&
            (inputs.destinations == 'all' || inputs.destinations == 'curseforge')
          )
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out publisher helper
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.publisher_commit }}
          fetch-depth: 1
          path: publisher

      - name: Download validated Release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-package

      - name: Audit every selected CurseForge state entry
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURSEFORGE_PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID || '1660840' }}
          CLEANUP_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_label_cleanup || 'none' }}
        run: |
          set -euo pipefail
          python publisher/scripts/python/curseforge_state.py audit \
            --manifest release-package/release-manifest.json \
            --context release-package/release-context.json \
            --git-repository publisher \
            --repository "$GITHUB_REPOSITORY" \
            --project "$CURSEFORGE_PROJECT" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --cleanup-mode "$CLEANUP_MODE" \
            --output curseforge-state-audit.json

      - name: Upload read-only CurseForge state audit
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: curseforge-state-audit
          path: curseforge-state-audit.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 14

  publish-curseforge:
    name: Publish CurseForge Minecraft ${{ matrix.mc_version }}
    needs: [inspect, package-release, package-dispatch, publish-github, curseforge-state-audit]
    if: >-
      ${{
        always() &&
        needs.inspect.result == 'success' &&
        needs.curseforge-state-audit.result == 'success' &&
        needs.inspect.outputs.prerelease != 'true' &&
        (
          (
            github.event_name == 'release' &&
            needs.package-release.result == 'success' &&
            needs.publish-github.result == 'success'
          ) ||
          (
            github.event_name == 'workflow_dispatch' &&
            needs.package-dispatch.result == 'success' &&
            (inputs.destinations == 'all' || inputs.destinations == 'curseforge')
          )
        )
      }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.inspect.outputs.matrix) }}
    steps:
      - name: Check out publisher helper
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.publisher_commit }}
          fetch-depth: 1
          path: publisher

      - name: Download validated Release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-package

      - name: Validate CurseForge project identity
        id: curseforge-project
        shell: bash
        env:
          CURSEFORGE_PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID || '1660840' }}
        run: |
          set -euo pipefail
          python publisher/scripts/python/curseforge_state.py validate-project \
            --project "$CURSEFORGE_PROJECT" \
            --github-output "$GITHUB_OUTPUT"

      - name: Read project publication metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          python publisher/scripts/python/release_metadata.py platform-entry \
            --manifest release-package/release-manifest.json \
            --build-project '${{ matrix.mc_version }}' \
            --github-output "$GITHUB_OUTPUT"

      - name: Check CurseForge state and upload history
        id: curseforge
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python publisher/scripts/python/curseforge_state.py precheck \
            --manifest release-package/release-manifest.json \
            --context release-package/release-context.json \
            --git-repository publisher \
            --build-project '${{ matrix.mc_version }}' \
            --repository "$GITHUB_REPOSITORY" \
            --project '${{ steps.curseforge-project.outputs.project_id }}' \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --event-name "$GITHUB_EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Migrate legacy CurseForge file ID to Git notes
        if: ${{ steps.curseforge.outputs.state_source == 'legacy-label' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python publisher/scripts/python/curseforge_state.py record \
            --manifest release-package/release-manifest.json \
            --context release-package/release-context.json \
            --git-repository publisher \
            --build-project '${{ matrix.mc_version }}' \
            --repository "$GITHUB_REPOSITORY" \
            --project '${{ steps.curseforge-project.outputs.project_id }}' \
            --file-id '${{ steps.curseforge.outputs.file_id }}' \
            --source legacy-label

      - name: Update existing CurseForge metadata
        if: ${{ steps.curseforge.outputs.should_upload == 'false' }}
        shell: bash
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: |
          set -euo pipefail
          python publisher/scripts/python/curseforge_state.py update \
            --manifest release-package/release-manifest.json \
            --build-project '${{ matrix.mc_version }}' \
            --project '${{ steps.curseforge-project.outputs.project_id }}' \
            --file-id '${{ steps.curseforge.outputs.file_id }}'

      - name: Upload to CurseForge
        id: upload
        if: ${{ steps.curseforge.outputs.should_upload == 'true' }}
        uses: Kira-NT/mc-publish@52307b03863581dec6b652b83e597aec02ebb075
        with:
          curseforge-id: ${{ steps.curseforge-project.outputs.project_id }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.metadata.outputs.jar }}
          name: ${{ needs.inspect.outputs.tag }}
          version: ${{ needs.inspect.outputs.tag }}
          version-type: release
          changelog-file: release-package/CHANGELOG.md
          loaders: fabric
          game-versions: ${{ steps.metadata.outputs.game_versions }}
          dependencies: ${{ steps.metadata.outputs.dependencies }}
          retry-attempts: 1

      - name: Validate CurseForge upload outputs
        id: validated-upload
        if: ${{ steps.curseforge.outputs.should_upload == 'true' }}
        shell: bash
        env:
          CURSEFORGE_VERSION: ${{ steps.upload.outputs.curseforge-version }}
          CURSEFORGE_FILES: ${{ steps.upload.outputs.curseforge-files }}
          CURSEFORGE_URL: ${{ steps.upload.outputs.curseforge-url }}
        run: |
          set -euo pipefail
          python publisher/scripts/python/curseforge_state.py validate-upload \
            --manifest release-package/release-manifest.json \
            --build-project '${{ matrix.mc_version }}' \
            --project '${{ steps.curseforge-project.outputs.project_id }}' \
            --version "$CURSEFORGE_VERSION" \
            --files "$CURSEFORGE_FILES" \
            --url "$CURSEFORGE_URL" \
            --github-output "$GITHUB_OUTPUT"

      - name: Persist uploaded CurseForge file ID in Git notes
        if: ${{ steps.curseforge.outputs.should_upload == 'true' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python publisher/scripts/python/curseforge_state.py record \
            --manifest release-package/release-manifest.json \
            --context release-package/release-context.json \
            --git-repository publisher \
            --build-project '${{ matrix.mc_version }}' \
            --repository "$GITHUB_REPOSITORY" \
            --project '${{ steps.curseforge-project.outputs.project_id }}' \
            --file-id '${{ steps.validated-upload.outputs.file_id }}' \
            --source upload

  curseforge-label-cleanup:
    name: Clear verified legacy CurseForge Asset labels
    needs:
      [inspect, package-release, package-dispatch, curseforge-state-audit, publish-curseforge]
    if: >-
      ${{
        always() &&
        github.event_name == 'workflow_dispatch' &&
        inputs.legacy_label_cleanup != 'none' &&
        needs.inspect.result == 'success' &&
        needs.curseforge-state-audit.result == 'success' &&
        needs.publish-curseforge.result == 'success'
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out current publisher helper
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.inspect.outputs.publisher_commit }}
          fetch-depth: 1
          path: publisher

      - name: Download validated Release package
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: release-package

      - name: Clear labels after Git-note migration
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CURSEFORGE_PROJECT: ${{ vars.CURSEFORGE_PROJECT_ID || '1660840' }}
          CLEANUP_MODE: ${{ inputs.legacy_label_cleanup }}
        run: |
          set -euo pipefail
          python publisher/scripts/python/curseforge_state.py clear-labels \
            --manifest release-package/release-manifest.json \
            --context release-package/release-context.json \
            --git-repository publisher \
            --repository "$GITHUB_REPOSITORY" \
            --project "$CURSEFORGE_PROJECT" \
            --mode "$CLEANUP_MODE"
