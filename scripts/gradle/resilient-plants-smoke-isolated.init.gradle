String runDirectory = System.getenv('FGA_PLANTS_SMOKE_RUN_DIR')
if (runDirectory == null || runDirectory.isBlank()) {
    throw new GradleException('FGA_PLANTS_SMOKE_RUN_DIR must name an isolated test directory')
}
gradle.afterProject { project ->
    if (project.path == ':1.21.1') {
        project.loom.runs.named('server') { runDir runDirectory }
    }
}
