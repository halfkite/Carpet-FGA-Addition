final int mcVersion = project.mcVersion
final boolean unobfuscated = mcVersion >= 26_00_00

apply plugin: unobfuscated ? 'net.fabricmc.fabric-loom' : 'net.fabricmc.fabric-loom-remap'
apply plugin: 'com.replaymod.preprocess'

repositories {
    maven {
        url = 'https://masa.dy.fi/maven'
        content { includeModule('carpet', 'fabric-carpet') }
    }
    maven {
        url = 'https://maven.fallenbreath.me/jitpack'
        content { includeGroupAndSubgroups('com.github') }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    if (!unobfuscated) {
        mappings loom.officialMojangMappings()
    }
    def loader = unobfuscated ? implementation("net.fabricmc:fabric-loader:${project.loader_version}")
            : modImplementation("net.fabricmc:fabric-loader:${project.loader_version}")
    def carpet = project.carpet_core_version.startsWith('com.github.')
            ? project.carpet_core_version
            : "carpet:fabric-carpet:${project.carpet_core_version}"
    if (unobfuscated) {
        implementation carpet
    } else {
        modImplementation carpet
    }
}

if (mcVersion >= 1_21_10 && mcVersion < 26_00_00) {
    configurations.configureEach {
        resolutionStrategy.force 'io.github.llamalad7:mixinextras-fabric:0.5.4'
    }
}

def javaVersion = mcVersion >= 26_00_00
        ? JavaVersion.VERSION_25
        : (mcVersion >= 1_20_05 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_16)
group = project.maven_group
def artifactMcVersion = project.findProperty('artifact_mc_version') ?: project.minecraft_version
version = "${project.mod_version}+v${new Date().format('yyMMddHHmm')}-mc${artifactMcVersion}"
base.archivesName = project.archives_base_name

loom {
    mixin {
        useLegacyMixinAp = !unobfuscated
    }
}

processResources {
    def properties = [
            version: project.version,
            minecraft_dependency: project.minecraft_dependency,
            carpet_dependency: project.carpet_dependency,
            fabric_api_dependency: '',
            java_level: javaVersion == JavaVersion.VERSION_25 ? 25 : (javaVersion == JavaVersion.VERSION_21 ? 21 : 16),
            compatibility_level: javaVersion == JavaVersion.VERSION_25 ? 'JAVA_25' : (javaVersion == JavaVersion.VERSION_21 ? 'JAVA_21' : 'JAVA_16')
    ]
    inputs.properties(properties)
    filesMatching('fabric.mod.json') { expand properties }
    filesMatching('carpet-fga-addition.mixins.json') {
        filter { line -> line.replace('{{COMPATIBILITY_LEVEL}}', properties.compatibility_level) }
    }
    doLast {
        if (mcVersion < 1_17_00 || mcVersion >= 26_01_00) return

        def recipeDirectory = destinationDir.toPath().resolve(
                mcVersion >= 1_21_00 ? 'data/carpet-fga-addition/recipe' : 'data/carpet-fga-addition/recipes')
        java.nio.file.Files.createDirectories(recipeDirectory)
        def outputs = [
                chiseled_deepslate: 1,
                cobbled_deepslate: 1,
                cobbled_deepslate_slab: 2,
                cobbled_deepslate_stairs: 1,
                cobbled_deepslate_wall: 1,
                deepslate_brick_slab: 2,
                deepslate_brick_stairs: 1,
                deepslate_brick_wall: 1,
                deepslate_bricks: 1,
                deepslate_tile_slab: 2,
                deepslate_tile_stairs: 1,
                deepslate_tile_wall: 1,
                deepslate_tiles: 1,
                polished_deepslate: 1,
                polished_deepslate_slab: 2,
                polished_deepslate_stairs: 1,
                polished_deepslate_wall: 1
        ]
        outputs.each { output, count ->
            def ingredient = mcVersion >= 1_21_02
                    ? '"minecraft:deepslate"'
                    : '{"item":"minecraft:deepslate"}'
            def recipe = mcVersion >= 1_20_05
                    ? [type: 'minecraft:stonecutting', ingredient: new groovy.json.JsonSlurper().parseText(ingredient),
                       result: [id: "minecraft:${output}", count: count]]
                    : [type: 'minecraft:stonecutting', ingredient: [item: 'minecraft:deepslate'],
                       result: "minecraft:${output}", count: count]
            def target = recipeDirectory.resolve("${output}_from_deepslate_stonecutting.json")
            java.nio.file.Files.writeString(target,
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(recipe)) + System.lineSeparator())
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion == JavaVersion.VERSION_25 ? 25 : (javaVersion == JavaVersion.VERSION_21 ? 21 : 16)
}

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

if (mcVersion < 1_18_00) {
    sourceSets.main.java.exclude(
            'carpet/fga/mixin/ClientboundPlayerInfoUpdatePacketMixin.java',
            'carpet/fga/mixin/CustomPacketPayloadMixin.java',
            'carpet/fga/mixin/ServerGamePacketListenerImplMixin.java',
            'carpet/fga/mixin/ServerCommonPacketListenerAccessor.java',
            'carpet/fga/mixin/ServerCommonPacketListenerImplMixin.java',
            'carpet/fga/mixin/FillBiomeCommandLimitMixin.java',
            'carpet/fga/mixin/PlayerCommandMixin.java',
            'carpet/fga/mixin/ClientPacketListenerMixin.java',
            'carpet/fga/mixin/FriendlyByteBufMixin.java',
            'carpet/fga/mixin/FriendlyByteBufWriteMixin.java'
    )
}



if (mcVersion < 1_19_03) {
    sourceSets.main.java.exclude(
            'carpet/fga/mixin/ClientboundPlayerInfoUpdatePacketMixin.java'
    )
}

if (mcVersion < 1_19_04) {
    sourceSets.main.java.exclude(
            'carpet/fga/mixin/FillBiomeCommandLimitMixin.java',
            'carpet/fga/mixin/FillCommandLimitMixin.java',
            'carpet/fga/mixin/CarpetFillCommandLimitMixin.java'
    )
} else {
    sourceSets.main.java.exclude(
            'carpet/fga/mixin/CarpetFillCommandLimitMixin.java'
    )
}

if (mcVersion < 1_20_05) {
    sourceSets.main.java.exclude(
            'carpet/fga/mixin/CustomPacketPayloadMixin.java',
            'carpet/fga/mixin/ServerGamePacketListenerImplMixin.java',
            'carpet/fga/mixin/FriendlyByteBufMixin.java'
    )
}

if (mcVersion < 1_20_02) {
    sourceSets.main.java.exclude(
            'carpet/fga/mixin/ServerCommonPacketListenerAccessor.java',
            'carpet/fga/mixin/ServerCommonPacketListenerImplMixin.java'
    )
} else {
    sourceSets.main.java.exclude(
            'carpet/fga/mixin/LegacyServerGamePacketListenerImplMixin.java',
            'carpet/fga/mixin/LegacyClientPacketListenerMixin.java'
    )
}
