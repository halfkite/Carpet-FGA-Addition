name: Update Carpet FGA Release Metadata

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release version to update'
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    name: Update GitHub and Modrinth metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select release notes
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          version_notes="docs/releases/$RELEASE_TAG.md"
          if [[ ! -f "$version_notes" ]]; then
            echo "Missing version-specific release notes: $version_notes" >&2
            exit 1
          fi
          cp "$version_notes" RELEASE_NOTES.md

      - name: Update GitHub Release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_TAG" \
            --notes-file RELEASE_NOTES.md

      - name: Update Modrinth changelog
        shell: pwsh
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_API_TOKEN }}
          MODRINTH_PROJECT: ${{ vars.MODRINTH_PROJECT_ID || 'carpet-fga-addition' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Authorization = $env:MODRINTH_TOKEN
            'User-Agent' = 'halfkite/Carpet-FGA-Addition release metadata updater'
          }
          $versions = Invoke-RestMethod -Uri "https://api.modrinth.com/v2/project/$env:MODRINTH_PROJECT/version" -Headers $headers
          $matches = @($versions | Where-Object {
            $_.version_number -eq $env:RELEASE_TAG -or
            $_.version_number.StartsWith("$env:RELEASE_TAG+mc")
          })
          if ($matches.Count -eq 0) {
            throw "No Modrinth versions found for $env:RELEASE_TAG"
          }
          $payload = @{ changelog = Get-Content -Raw 'RELEASE_NOTES.md' } | ConvertTo-Json
          foreach ($version in $matches) {
            $request = @{
              Method = 'Patch'
              Uri = "https://api.modrinth.com/v2/version/$($version.id)"
              Headers = $headers
              ContentType = 'application/json'
              Body = $payload
            }
            Invoke-RestMethod @request
          }
