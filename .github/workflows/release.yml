name: Release Carpet FGA Addition

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'New release tag, for example 1.4.10'
        required: true
        type: string
      target_subproject:
        description: 'Minecraft version to publish, or all'
        required: false
        type: choice
        default: all
        options:
          - all
          - '1.20.1'
          - '1.21'
          - '1.21.1'
          - '1.21.4'
          - '1.21.5'
          - '1.21.8'
          - '1.21.10'
          - '1.21.11'
          - '26.1.2'
          - '26.2'
      previous_tag:
        description: 'Previous tag for the changelog; leave empty to detect it'
        required: false
        type: string
      release_type:
        description: 'Formal release removes the build timestamp from the JAR name; beta keeps it'
        required: false
        type: choice
        default: release
        options:
          - release
          - beta
      publish_destination:
        description: 'Platforms to publish; narrower choices are for safe retries'
        required: false
        type: choice
        default: all
        options:
          - all
          - github-modrinth
          - curseforge

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  RELEASE_TYPE: ${{ inputs.release_type }}

jobs:
  build:
    name: Build release artifacts
    uses: ./.github/workflows/build.yml
    with:
      target_subproject: ${{ inputs.target_subproject || 'all' }}
      ref: ${{ github.sha }}

  prepare:
    name: Create release and changelog
    needs: build
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate short changelog
        env:
          PREVIOUS_TAG: ${{ inputs.previous_tag }}
        run: |
          set -euo pipefail
          args=(--head "$GITHUB_SHA" --tag "$RELEASE_TAG" --output RELEASE_NOTES.md)
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(--previous-tag "$PREVIOUS_TAG")
          fi
          python scripts/python/release_notes.py "${args[@]}"

      - name: Create tag and GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git show-ref --tags --verify --quiet "refs/tags/$RELEASE_TAG"; then
            tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
            if ! git merge-base --is-ancestor "$tag_commit" "$GITHUB_SHA"; then
              echo "Tag $RELEASE_TAG points outside the current release history: $tag_commit" >&2
              exit 1
            fi
          else
            git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
            git push origin "$RELEASE_TAG"
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Reusing existing GitHub Release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes-file RELEASE_NOTES.md
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  publish-github-modrinth:
    name: Publish GitHub and Modrinth
    needs: [prepare, build]
    if: ${{ inputs.publish_destination == 'all' || inputs.publish_destination == 'github-modrinth' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: build-*
          path: release-assets

      - name: Prepare formal JAR names
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
          TARGET_SUBPROJECT: ${{ inputs.target_subproject }}
        run: |
          $ErrorActionPreference = 'Stop'
          $directories = @(Get-ChildItem 'release-assets' -Directory | Where-Object { $_.Name -like 'build-*' })
          if ($env:TARGET_SUBPROJECT -ne 'all') {
            $directories = @($directories | Where-Object { $_.Name -eq "build-$env:TARGET_SUBPROJECT" })
          }
          if ($directories.Count -eq 0) {
            throw 'No matching build artifacts were downloaded'
          }
          foreach ($directory in $directories) {
            $mcVersion = $directory.Name.Substring('build-'.Length)
            $source = @(Get-ChildItem $directory.FullName -Filter '*.jar')
            if ($source.Count -ne 1) {
              throw "Expected exactly one JAR for $mcVersion, found $($source.Count)"
            }
            if ($env:RELEASE_TYPE -eq 'release') {
              $publishedName = "carpet-fga-addition-$env:RELEASE_TAG-mc$mcVersion.jar"
              Move-Item $source[0].FullName (Join-Path $directory.FullName $publishedName)
            }
          }

      - name: Upload JARs to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          mapfile -d '' jars < <(find release-assets -type f -name '*.jar' -print0)
          if [[ ${#jars[@]} -eq 0 ]]; then
            echo 'No JAR files found' >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${jars[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Publish one version to Modrinth
        uses: Kira-NT/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID || 'carpet-fga-addition' }}
          modrinth-token: ${{ secrets.MODRINTH_API_TOKEN }}
          files: release-assets/**/*.jar
          name: ${{ inputs.release_tag }}
          version: ${{ inputs.release_tag }}
          version-type: ${{ inputs.release_type }}
          loaders: fabric
          game-versions: |
            1.20.1
            1.21
            1.21.1
            1.21.4
            1.21.5
            1.21.8
            1.21.10
            1.21.11
            26.1.2
            26.2
          dependencies: |
            carpet(required){modrinth:TQTTVgYE}{curseforge:349239}

  publish-curseforge:
    name: Publish CurseForge Minecraft ${{ matrix.mc_version }}
    needs: [prepare, build]
    if: ${{ inputs.publish_destination == 'all' || inputs.publish_destination == 'curseforge' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc_version: ${{ inputs.target_subproject == 'all' && fromJSON('["1.20.1","1.21","1.21.1","1.21.4","1.21.5","1.21.8","1.21.10","1.21.11","26.1.2","26.2"]') || fromJSON(format('["{0}"]', inputs.target_subproject)) }}

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-${{ matrix.mc_version }}
          path: release-assets/${{ matrix.mc_version }}

      - name: Prepare formal JAR name
        id: artifact
        shell: pwsh
        env:
          MC_VERSION: ${{ matrix.mc_version }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path 'release-assets' $env:MC_VERSION
          $source = @(Get-ChildItem $dir -Filter '*.jar')
          if ($source.Count -ne 1) {
            throw "Expected exactly one downloaded JAR for $env:MC_VERSION, found $($source.Count)"
          }
          if ($env:RELEASE_TYPE -eq 'release') {
            $publishedPath = Join-Path $dir "carpet-fga-addition-$env:RELEASE_TAG-mc$env:MC_VERSION.jar"
            Move-Item $source[0].FullName $publishedPath
          } else {
            $publishedPath = $source[0].FullName
          }
          "jar=$publishedPath" >> $env:GITHUB_OUTPUT

      - name: Publish to CurseForge
        uses: Kira-NT/mc-publish@v3.3
        with:
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID || '1660840' }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: ${{ steps.artifact.outputs.jar }}
          name: ${{ inputs.release_tag }}
          version: ${{ inputs.release_tag }}
          version-type: ${{ inputs.release_type }}
          loaders: fabric
          game-versions: ${{ matrix.mc_version }}
          dependencies: |
            carpet(required){modrinth:TQTTVgYE}{curseforge:349239}
