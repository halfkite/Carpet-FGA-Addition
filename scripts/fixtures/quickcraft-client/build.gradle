plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.14'
}

repositories {
    maven { url = 'https://masa.dy.fi/maven' }
    maven { url = 'https://masa.dy.fi/maven/sakura-ryoko/' }
}

def quickCraftJar = findProperty('quickcraftJar')
if (quickCraftJar == null || !file(quickCraftJar).isFile()) {
    throw new GradleException('Pass -PquickcraftJar=<path-to-quickcraft.jar>')
}
def amsJar = findProperty('amsJar')

dependencies {
    minecraft 'com.mojang:minecraft:1.21.1'
    mappings 'net.fabricmc:yarn:1.21.1+build.3:v2'
    modImplementation 'net.fabricmc:fabric-loader:0.19.1'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.102.1+1.21.1'
    modImplementation 'fi.dy.masa.malilib:malilib-fabric-1.21:0.21.10'
    modLocalRuntime files(quickCraftJar)
    if (amsJar != null && file(amsJar).isFile()) {
        modImplementation 'carpet:fabric-carpet:1.21-1.4.147+v240613'
    }
}

loom {
    runs {
        client {
            runDir findProperty('runDir') ?: 'run'
        }
    }
}
