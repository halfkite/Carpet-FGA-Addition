name: Build supported versions

on:
  workflow_call:
    inputs:
      target_subproject:
        description: 'Minecraft build project to build, comma-separated projects, or all'
        required: false
        type: string
        default: all
      ref:
        description: 'Exact Git ref or commit to build'
        required: false
        type: string
        default: ''
      release_version:
        description: 'Exact release version to embed; empty keeps development timestamp versions'
        required: false
        type: string
        default: ''
    outputs:
      matrix:
        description: 'Dynamic build matrix generated from settings.json.publishVersions'
        value: ${{ jobs.prepare.outputs.matrix }}
      versions:
        description: 'Selected build projects as a JSON array'
        value: ${{ jobs.prepare.outputs.versions }}
      commit:
        description: 'Resolved commit that was built'
        value: ${{ jobs.prepare.outputs.commit }}
  workflow_dispatch:
    inputs:
      target_subproject:
        description: 'Minecraft build project to build, comma-separated projects, or all'
        required: false
        type: string
        default: all
      ref:
        description: 'Exact Git ref or commit to build; empty uses this workflow run commit'
        required: false
        type: string
        default: ''
      release_version:
        description: 'Exact release version to embed; empty keeps development timestamp versions'
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare dynamic build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      versions: ${{ steps.prepare.outputs.versions }}
      commit: ${{ steps.prepare.outputs.commit }}
    steps:
      - name: Check out requested source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}
          fetch-depth: 1

      - name: Read publishVersions and resolve commit
        id: prepare
        shell: bash
        env:
          TARGET_SUBPROJECT: ${{ inputs.target_subproject || 'all' }}
        run: |
          set -euo pipefail
          python scripts/python/release_metadata.py matrix \
            --repo-root . \
            --target "$TARGET_SUBPROJECT" \
            --github-output "$GITHUB_OUTPUT"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Minecraft ${{ matrix.mc_version }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Check out resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1

      - name: Select preprocessing root
        shell: bash
        run: printf '1.21.1\n' > versions/mainProject

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build ${{ matrix.mc_version }}
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ -n "$RELEASE_VERSION" ]]; then
            ./gradlew :${{ matrix.mc_version }}:build --no-daemon \
              "-Ppublication_version=$RELEASE_VERSION"
          else
            ./gradlew :${{ matrix.mc_version }}:build --no-daemon
          fi

      - name: Collect artifact metadata
        shell: pwsh
        env:
          MC_VERSION: ${{ matrix.mc_version }}
          EXPECTED_COMMIT: ${{ needs.prepare.outputs.commit }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $actualCommit = (git rev-parse HEAD).Trim()
          if ($actualCommit -ne $env:EXPECTED_COMMIT) {
            throw "Checked out $actualCommit, expected $env:EXPECTED_COMMIT"
          }

          $buildDir = Join-Path 'versions' $env:MC_VERSION
          $jarFiles = @(Get-ChildItem (Join-Path $buildDir 'build/libs') -Filter '*.jar' |
            Where-Object { $_.Name -notmatch '(-dev|-sources|-javadoc)\.jar$' })
          if ($jarFiles.Count -ne 1) {
            throw "Expected exactly one distributable JAR for $env:MC_VERSION, found $($jarFiles.Count)"
          }

          $properties = @{}
          foreach ($line in Get-Content (Join-Path $buildDir 'gradle.properties')) {
            if ($line -match '^\s*([^#!][^=]*)=(.*)$') {
              $properties[$matches[1].Trim()] = $matches[2].Trim()
            }
          }
          $artifactMcVersion = if ($properties.ContainsKey('artifact_mc_version')) {
            $properties['artifact_mc_version']
          } else {
            $properties['minecraft_version']
          }

          $outDir = Join-Path 'release-assets' $env:MC_VERSION
          New-Item -ItemType Directory -Force $outDir | Out-Null
          $jar = $jarFiles[0]
          $copiedJar = Join-Path $outDir $jar.Name
          Copy-Item $jar.FullName $copiedJar
          $sha = (Get-FileHash $copiedJar -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            mod = 'carpet-fga-addition'
            build_project = $env:MC_VERSION
            minecraft_version = $properties['minecraft_version']
            minecraft_dependency = $properties['minecraft_dependency']
            artifact_mc_version = $artifactMcVersion
            artifact = $jar.Name
            sha256 = $sha
            commit = $actualCommit
            publication_version = $env:RELEASE_VERSION
            build_command = if ([string]::IsNullOrWhiteSpace($env:RELEASE_VERSION)) {
              "./gradlew :$env:MC_VERSION`:build --no-daemon"
            } else {
              "./gradlew :$env:MC_VERSION`:build --no-daemon -Ppublication_version=$env:RELEASE_VERSION"
            }
            workflow = $env:GITHUB_WORKFLOW
            run_id = $env:GITHUB_RUN_ID
            run_attempt = $env:GITHUB_RUN_ATTEMPT
          }
          $manifest | ConvertTo-Json | Set-Content -Encoding utf8 `
            -Path (Join-Path $outDir "build-manifest-$env:MC_VERSION.json")

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.mc_version }}
          path: release-assets/${{ matrix.mc_version }}
          if-no-files-found: error
          overwrite: true
          retention-days: 14

  verify-minecraft-1-21-runtime:
    name: Verify shared JAR on Minecraft 1.21
    needs: [prepare, build]
    if: ${{ contains(fromJSON(needs.prepare.outputs.versions), '1.21.1') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out resolved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          fetch-depth: 1

      - name: Download Minecraft 1.21.1 build
        uses: actions/download-artifact@v4
        with:
          name: build-1.21.1
          path: runtime-artifact

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Minecraft 1.21 compatibility fixture
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find runtime-artifact -type f -name '*.jar' \
            ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar')
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "Expected exactly one runtime JAR, found ${#jars[@]}" >&2
            exit 1
          fi
          python scripts/python/mc121_runtime_fixture.py --jar "${jars[0]}"
