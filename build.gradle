import groovy.json.JsonSlurper

plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.14' apply false
    id 'net.fabricmc.fabric-loom-remap' version '1.17.14' apply false
    id 'com.replaymod.preprocess' version 'c5abb4fb12'
}

preprocess {
    strictExtraMappings = false

    def mc1211 = createNode('1.21.1', 1_21_01, '')
    def mc1213 = createNode('1.21.3', 1_21_03, '')
    def mc1214 = createNode('1.21.4', 1_21_04, '')
    def mc1215 = createNode('1.21.5', 1_21_05, '')
    def mc1218 = createNode('1.21.8', 1_21_08, '')
    def mc12110 = createNode('1.21.10', 1_21_10, '')
    def mc12111 = createNode('1.21.11', 1_21_11, '')
    def mc2601 = createNode('26.1.2', 26_01_02, '')
    def mc2602 = createNode('26.2', 26_02_00, '')

    mc1211.link(mc1213, file('versions/mapping-1.21.1-1.21.3.txt'))
    mc1213.link(mc1214, file('versions/mapping-1.21.3-1.21.4.txt'))
    mc1214.link(mc1215, file('versions/mapping-1.21.4-1.21.5.txt'))
    mc1215.link(mc1218, file('versions/mapping-1.21.5-1.21.8.txt'))
    mc1218.link(mc12110, file('versions/mapping-1.21.8-1.21.10.txt'))
    mc12110.link(mc12111, file('versions/mapping-1.21.10-1.21.11.txt'))
    mc12111.link(mc2601, file('versions/mapping-1.21.11-26.1.2.txt'))
    mc2601.link(mc2602, file('versions/mapping-26.1.2-26.2.txt'))

    for (def node in getNodes()) {
        findProject(node.project).ext.mcVersion = node.mcVersion
    }
}

def archiveTimestamp = new Date().format('yyyyMMdd-HHmmss', TimeZone.getTimeZone('Asia/Shanghai'))

def releaseSettings = new JsonSlurper().parseText(file('settings.json').text)
def publishedVersionNames = releaseSettings.publishVersions as List<String>
def publishedVersionProjects = subprojects.findAll { publishedVersionNames.contains(it.name) }

tasks.register('buildAllVersions') {
    dependsOn publishedVersionProjects.collect { it.tasks.named('build') }
    doLast {
        def archiveDir = layout.buildDirectory.dir("libs/${archiveTimestamp}").get().asFile
        if (archiveDir.exists()) {
            throw new GradleException("构建归档目录已存在：${archiveDir}")
        }
        if (!archiveDir.mkdirs()) {
            throw new GradleException("无法创建构建归档目录：${archiveDir}")
        }
        publishedVersionProjects.each { versionProject ->
            def artifactTask = versionProject.mcVersion >= 26_00_00
                    ? versionProject.tasks.named('jar').get()
                    : versionProject.tasks.named('remapJar').get()
            copy {
                from artifactTask.archiveFile
                into archiveDir
            }
        }
        println "全版本构建已归档到 ${archiveDir}"
    }
}

tasks.register('cleanTemporaryBuilds') {
    doLast {
        subprojects.each { delete it.layout.buildDirectory }
        delete layout.buildDirectory.dir('tmp')
    }
}
